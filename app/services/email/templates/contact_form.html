{% extends "base.html" %}

{% block content %}
<p style="margin:0 0 4px;font-size:11px;letter-spacing:1.5px;color:#6b7280;
          text-transform:uppercase;">Enquiry</p>
<p style="margin:0 0 20px;font-family:Georgia,'Times New Roman',serif;
          font-size:24px;color:#111111;">{{ subject_line }}</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:0 0 24px;background-color:#f5f5f5;">
  <tr>
    <td style="padding:16px 18px;border-left:3px solid #e0a32e;">
      <p style="margin:0;font-weight:600;">{{ name }}</p>
      <p style="margin:4px 0 0;font-size:14px;">
        <a href="mailto:{{ email }}" style="color:#111111;">{{ email }}</a>
      </p>
    </td>
  </tr>
</table>

<p style="margin:0 0 6px;font-size:11px;letter-spacing:1.5px;color:#6b7280;
          text-transform:uppercase;">Message</p>
<p style="margin:0 0 24px;line-height:1.7;white-space:pre-wrap;">{{ message }}</p>

{# Reply-To is set to the sender, so replying here answers them directly. #}
<p style="margin:0;font-size:14px;color:#6b7280;">
  Reply to this email and it goes straight to {{ name }}.
</p>
{% endblock %}
